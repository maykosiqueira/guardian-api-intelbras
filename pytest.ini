[pytest]
# pytest-homeassistant-custom-component (pulled in for the integration tests)
# installs autouse fixtures that block sockets and swap the event loop policy.
# These tests never use them — they drive the coordinator with a mocked hass —
# and on Windows the plugin's event_loop fixture dies with
# "SocketBlockedError: A test tried to use socket.socket" before any test runs.
# Disabling the plugin makes `pytest` work the same locally and in CI.
addopts = -p no:homeassistant
testpaths = tests
